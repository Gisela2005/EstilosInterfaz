<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de temas: LGMA</title>
<style>
  .panel {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #f1c2ea;
    --accent-text: #ffffff;
  }
  #dark:checked ~ .panel {
    --bg: #111827;
    --surface: #111827;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151;
    --accent: #ee65c0;
    --accent-text: #ffffff;
  }
  #custom:checked ~ .panel {
    --bg: #fffaf0;
    --surface: #fffaf0;
    --text: #1f2a1f;
    --muted: #6b7280;
    --border: #eadfc8;
    --accent: #2f855a;
    --accent-text: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f3f4f6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .app { width: 100%; max-width: 360px; }

  .app input[type="radio"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .panel {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: background .25s, color .25s, border-color .25s;
  }

  .tabs {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .tabs label {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    transition: background .2s, color .2s;
  }
  .tabs label + label { border-left: 1px solid var(--border); }

  #light:checked ~ .panel label[for="light"],
  #dark:checked ~ .panel label[for="dark"],
  #custom:checked ~ .panel label[for="custom"] {
    background: var(--accent);
    color: var(--accent-text);
  }

  #light:focus-visible ~ .panel label[for="light"],
  #dark:focus-visible ~ .panel label[for="dark"],
  #custom:focus-visible ~ .panel label[for="custom"] {
    outline: 2px solid var(--text);
    outline-offset: -4px;
  }

  .card { padding: 28px 4px 8px; }
  .card h1 { margin: 0 0 12px; font-size: 26px; }
  .card p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: var(--muted); }

  .btn {
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    font: inherit;
    font-size: 14px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: background .25s;
  }
</style>
</head>
<body>
  <div class="app">
    <input type="radio" name="tema" id="light" checked>
    <input type="radio" name="tema" id="dark">
    <input type="radio" name="tema" id="custom">

    <div class="panel">
      <div class="tabs">
        <label for="light">Light</label>
        <label for="dark">Dark</label>
        <label for="custom">Custom</label>
      </div>

      <div class="card">
        <h1>Hello, World!</h1>
        <p>Ejemplo con CSS </p>
        <button class="btn" type="button">Primer boton</button>
      </div>
    </div>
  </div>
</body>
</html>
